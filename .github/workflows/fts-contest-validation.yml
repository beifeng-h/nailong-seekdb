name: Seekdb FTS same-host source calibration

on:
  push:
    branches: [perf/fts-official-contract-20261108]

permissions:
  contents: read

concurrency:
  group: seekdb-fts-free-linux-validation
  cancel-in-progress: false

jobs:
  paired:
    if: ${{ github.repository == 'beifeng-h/nailong-seekdb' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      GIT_TERMINAL_PROMPT: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PAIRED_ROOT: ${{ runner.temp }}/seekdb-paired
    steps:
      - name: Checkout exact driver and official source objects without saved credentials
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          for sha in "$GITHUB_SHA" 5bce9e06d1281347ad61344e4b01fab9158c58a2 8db524bb0a3a847b4eb384232bd576761e4075b3; do
            git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$sha"
            git -C "$GITHUB_WORKSPACE" cat-file -e "$sha^{commit}"
          done
          git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run synthetic paired contracts before any long build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/script/seekdb -p 'test_fts_paired*.py' -v

      - name: Reclaim only disposable image tools and measure admission resources
        shell: bash
        run: |
          set -euo pipefail
          for image_tool in /usr/local/lib/android /usr/share/dotnet /opt/ghc; do
            if test -e "$image_tool"; then
              resolved=$(realpath -- "$image_tool")
              test "$resolved" = "$image_tool"
              case "$resolved" in
                /usr/local/lib/android|/usr/share/dotnet|/opt/ghc) sudo rm -rf -- "$resolved" ;;
                *) exit 2 ;;
              esac
            fi
          done
          uname -srmo
          getconf GNU_LIBC_VERSION
          nproc
          free -b
          df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free_bytes=$(df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -n1 | tr -d ' ')
          # Conservative admission only; subsequent actual disk measurements remain required.
          test "$free_bytes" -ge 48318382080

      - name: Install original documented host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git wget curl rpm rpm2cpio cpio make build-essential binutils m4 file python3 libtool-bin libaio1t64

      - name: Keep exact official dependency profile with HTTPS-only mirror transport
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/seekdb-https-tools"
          mkdir -p "$tools"
          cat > "$tools/wget" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          args=()
          for value in "$@"; do
            case "$value" in
              http://mirrors.oceanbase.com/*) value="https://mirrors.oceanbase.com/${value#http://mirrors.oceanbase.com/}" ;;
              https://mirrors.oceanbase.com/*) ;;
              http://*|https://*) echo 'Unexpected dependency download host' >&2; exit 93 ;;
            esac
            args+=("$value")
          done
          exec /usr/bin/wget --https-only --timeout=30 --tries=1 "${args[@]}"
          SH
          chmod 0755 "$tools/wget"
          printf '%s\n' "$tools" >> "$GITHUB_PATH"

      - name: Set up unchanged pinned Rust without Actions cache writes
        uses: ./.github/actions/setup-rust
        with:
          cache: 'false'
          crates-mirror: 'false'

      - name: Pin driver and role sources then switch the build path to official A
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/script/seekdb/fts_paired_validation.py --phase prepare \
            --source "$GITHUB_WORKSPACE" --root "$PAIRED_ROOT" --driver-sha "$GITHUB_SHA" --execute
          { uname -srmo; nproc; free -b; df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; } \
            > "$PAIRED_ROOT/evidence/baseline/resources-before.txt"

      - name: Initialize original A Release Unity configuration and dependencies
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 45m ./build.sh release --init 2>&1 \
            | tee "$PAIRED_ROOT/evidence/baseline/initialize.log"
          du -sx -B1 deps/3rd build_release | tee "$PAIRED_ROOT/evidence/baseline/sizes-after-init.txt"

      - name: Verify exact official native clients and actual loader before compilation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '798aa952d536563ee0291e69251a6d0cd0d85e0c470d5499768fa0731ff3c1be  deps/3rd/u01/obclient/bin/obclient' \
            '64e0323b385af2831c5b166a375e8320ec40e3ead0bd925295de1b8f5a2196c6  deps/3rd/u01/obclient/bin/mysqltest' \
            | tee "$PAIRED_ROOT/evidence/baseline/expected-clients.sha256"
          sha256sum -c "$PAIRED_ROOT/evidence/baseline/expected-clients.sha256"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/deps/3rd/u01/obclient/lib:$GITHUB_WORKSPACE/deps/3rd/u01/obclient/lib64:$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/deps/devel/lib:$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/deps/devel/lib64"
          for client in obclient mysqltest; do
            ldd "deps/3rd/u01/obclient/bin/$client" | tee "$PAIRED_ROOT/evidence/baseline/$client-prebuild-ldd.log"
            if grep -F 'not found' "$PAIRED_ROOT/evidence/baseline/$client-prebuild-ldd.log"; then exit 2; fi
            timeout 10s "deps/3rd/u01/obclient/bin/$client" --version
          done

      - name: Build original production A once with two jobs
        shell: bash
        run: |
          set -euo pipefail
          cmake_bin="$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/bin/cmake"
          /usr/bin/time -v timeout --signal=TERM --kill-after=30s 120m "$cmake_bin" \
            --build build_release --target seekdb -j2 2>&1 | tee "$PAIRED_ROOT/evidence/baseline/build.log"
          find build_release -type f -name '*.o' -printf '%T@ %s %p\n' | sort \
            > "$PAIRED_ROOT/evidence/baseline/object-times.txt"
          { free -b; df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; du -sx -B1 deps/3rd build_release; } \
            > "$PAIRED_ROOT/evidence/baseline/resources-after.txt"
          python3 "$PAIRED_ROOT/driver/fts_paired_validation.py" --phase snapshot --role baseline \
            --source "$GITHUB_WORKSPACE" --root "$PAIRED_ROOT" --driver-sha "$GITHUB_SHA" --execute

      - name: Switch the same build path to actual B source and regenerate its version
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PAIRED_ROOT/driver/fts_paired_validation.py" --phase switch-candidate \
            --source "$GITHUB_WORKSPACE" --root "$PAIRED_ROOT" --driver-sha "$GITHUB_SHA" --execute
          { free -b; df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; } \
            > "$PAIRED_ROOT/evidence/candidate/resources-before.txt"
          test "$(df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -n1 | tr -d ' ')" -ge 10737418240
          timeout --signal=TERM --kill-after=30s 45m ./build.sh release 2>&1 \
            | tee "$PAIRED_ROOT/evidence/candidate/reconfigure.log"

      - name: Build B incrementally with original Unity Rust and CMake pipeline
        shell: bash
        run: |
          set -euo pipefail
          cmake_bin="$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/bin/cmake"
          /usr/bin/time -v timeout --signal=TERM --kill-after=30s 90m "$cmake_bin" \
            --build build_release --target seekdb -j2 2>&1 | tee "$PAIRED_ROOT/evidence/candidate/build.log"
          find build_release -type f -name '*.o' -printf '%T@ %s %p\n' | sort \
            > "$PAIRED_ROOT/evidence/candidate/object-times.txt"
          { free -b; df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; du -sx -B1 deps/3rd build_release; } \
            > "$PAIRED_ROOT/evidence/candidate/resources-after.txt"
          python3 "$PAIRED_ROOT/driver/fts_paired_validation.py" --phase snapshot --role candidate \
            --source "$GITHUB_WORKSPACE" --root "$PAIRED_ROOT" --driver-sha "$GITHUB_SHA" --execute

      - name: Validate original cases then eight fresh paired rounds and untimed exact EXPLAINs
        shell: bash
        run: |
          set -euo pipefail
          test "$(df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -n1 | tr -d ' ')" -ge 8589934592
          timeout --signal=TERM --kill-after=180s 45m python3 "$PAIRED_ROOT/driver/fts_paired_validation.py" \
            --phase validate --source "$GITHUB_WORKSPACE" --root "$PAIRED_ROOT" \
            --driver-sha "$GITHUB_SHA" --execute

      - name: Always print explicit final or partial calibration verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$PAIRED_ROOT/driver/fts_paired_validation.py"; then
            python3 "$PAIRED_ROOT/driver/fts_paired_validation.py" --phase finalize \
              --source "$GITHUB_WORKSPACE" --root "$PAIRED_ROOT" --driver-sha "$GITHUB_SHA" --execute
          else
            echo 'PAIRED_NOT_STARTED: prerequisites or preflight failed; no calibration claimed'
            exit 1
          fi

      - name: Collect complete A and B ELFs and bounded owned paired evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 15m python3 "$PAIRED_ROOT/driver/fts_paired_collect.py" \
            --root "$PAIRED_ROOT" --out "$RUNNER_TEMP/seekdb-paired-artifact"

      - name: Preserve complete paired binaries and evidence for three days
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fts-paired-${{ github.sha }}
          path: ${{ runner.temp }}/seekdb-paired-artifact/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false

      - name: Always summarize scope and expose small reports in normal logs
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free -b
          if test -f "$PAIRED_ROOT/report.json"; then
            python3 - "$PAIRED_ROOT/report.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1], encoding="utf-8"))
          print("PAIRED_VISIBLE_RESULT", json.dumps({k:r[k] for k in
              ("status","driverCommit","kernelOrigin","baselineCommit","builds","caseVerdicts",
               "roundVerdicts","sameHostPerformance","failure") if k in r}, ensure_ascii=False))
          PY
          fi
          {
            printf '### Same-host FTS development calibration\n\n'
            printf 'Actual B source and driver: %s. Kernel origin: 8db524bb0a3a847b4eb384232bd576761e4075b3.\n\n' "$GITHUB_SHA"
            printf 'A: exact official 5bce9e06d1281347ad61344e4b01fab9158c58a2. One cold source build plus original-pipeline incremental B build.\n\n'
            printf 'Five original cases on A, six selected cases on B; eight fresh default rounds ABBA BAAB; four untimed exact-query EXPLAINs per role. No profiler or ablation.\n\n'
            printf 'Calibration performance is separate from correctness/infrastructure: valid negative or inconclusive calibration exits zero and is explicitly classified with a predeclared 2%% margin. No formal contest score is claimed.\n\n'
            printf 'Small exact identities and paired metrics are printed in normal logs. Complete ELFs are independently preserved or collection explicitly fails; artifact access is not required to read the calibration result.\n'
          } >> "$GITHUB_STEP_SUMMARY"
