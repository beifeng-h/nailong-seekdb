name: Seekdb FTS verified ELF continuation

on:
  push:
    branches: [perf/fts-official-contract-20261108]

permissions:
  contents: read

concurrency:
  group: seekdb-fts-free-linux-validation
  cancel-in-progress: false

jobs:
  paired:
    if: ${{ github.repository == 'beifeng-h/nailong-seekdb' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    env:
      GIT_TERMINAL_PROMPT: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact validation driver and separate actual A and B source objects
        shell: bash
        run: |
          set -euo pipefail
          printf 'PAIRED_ROOT=%s/seekdb-paired\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          # Fetch all exact objects in one shallow transaction without background maintenance.
          git -c maintenance.auto=false -c gc.auto=0 -C "$GITHUB_WORKSPACE" \
            fetch --atomic --no-auto-maintenance --no-tags --depth=1 origin \
            "$GITHUB_SHA" 5bce9e06d1281347ad61344e4b01fab9158c58a2 bc4dde62eee39acb630ffe54741aecebe4ab0a2a f1f4d0d4b225ec528dc3802dbfd93d9d4870aa65
          for sha in "$GITHUB_SHA" 5bce9e06d1281347ad61344e4b01fab9158c58a2 bc4dde62eee39acb630ffe54741aecebe4ab0a2a f1f4d0d4b225ec528dc3802dbfd93d9d4870aa65; do
            git -C "$GITHUB_WORKSPACE" cat-file -e "$sha^{commit}"
          done
          git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run all offline FTS contracts before download or execution
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s .github/script/seekdb -p 'test_fts*.py' -v

      - name: Reclaim only disposable image tools and admit download and extraction resources
        shell: bash
        run: |
          set -euo pipefail
          for image_tool in /usr/local/lib/android /usr/share/dotnet /opt/ghc; do
            if test -e "$image_tool"; then
              resolved=$(realpath -- "$image_tool")
              test "$resolved" = "$image_tool"
              case "$resolved" in
                /usr/local/lib/android|/usr/share/dotnet|/opt/ghc) sudo rm -rf -- "$resolved" ;;
                *) exit 2 ;;
              esac
            fi
          done
          uname -srmo
          getconf GNU_LIBC_VERSION
          nproc
          free -b
          df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          test "$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n1 | tr -d ' ')" -ge 48318382080
          test ! -e "$RUNNER_TEMP/seekdb-original-artifact"
          mkdir -m 0700 "$RUNNER_TEMP/seekdb-original-artifact"

      - name: Install original documented host prerequisites for unchanged runtime setup
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git wget curl rpm rpm2cpio cpio make build-essential binutils m4 file python3 libtool-bin libaio1t64

      - name: Download only immutable original ZIP through official same-repository Actions route
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node24
        with:
          artifact-ids: '13621468966'
          repository: beifeng-h/nailong-seekdb
          run-id: '42486120779'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/seekdb-original-artifact
          skip-decompress: true
          digest-mismatch: error

      - name: Verify full original ZIP and relocate independent A and B ELFs without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/seekdb-original-artifact"
          test -d "$artifact_dir" && test ! -L "$artifact_dir"
          # The official fallback basename is 'artifact'; trust bytes, never a suffix.
          mapfile -d '' -t archives < <(find "$artifact_dir" -mindepth 1 -maxdepth 1 -print0)
          test "${#archives[@]}" -eq 1
          test -f "${archives[0]}" && test ! -L "${archives[0]}"
          test "$(stat -c '%h' -- "${archives[0]}")" -eq 1
          test "$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n1 | tr -d ' ')" -ge 17179869184
          python3 -B .github/script/seekdb/fts_paired_validation.py --phase prepare-reuse \
            --source "$GITHUB_WORKSPACE" --root "$PAIRED_ROOT" --driver-sha "$GITHUB_SHA" \
            --artifact-zip "${archives[0]}" --execute
          { uname -srmo; nproc; free -b; df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; } \
            > "$PAIRED_ROOT/evidence/baseline/resources-before.txt"

      - name: Keep exact official dependency profile with HTTPS-only mirror transport
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/seekdb-https-tools"
          mkdir -p "$tools"
          cat > "$tools/wget" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          args=()
          for value in "$@"; do
            case "$value" in
              http://mirrors.oceanbase.com/*) value="https://mirrors.oceanbase.com/${value#http://mirrors.oceanbase.com/}" ;;
              https://mirrors.oceanbase.com/*) ;;
              http://*|https://*) echo 'Unexpected dependency download host' >&2; exit 93 ;;
            esac
            args+=("$value")
          done
          exec /usr/bin/wget --https-only --timeout=30 --tries=1 "${args[@]}"
          SH
          chmod 0755 "$tools/wget"
          printf '%s\n' "$tools" >> "$GITHUB_PATH"

      - name: Set up unchanged pinned Rust without Actions cache writes
        uses: ./.github/actions/setup-rust
        with:
          cache: 'false'
          crates-mirror: 'false'

      - name: Initialize unchanged original dependencies and runtime clients without a build target
        shell: bash
        run: |
          set -euo pipefail
          # --init configures the original Release profile; no compilation target is invoked.
          timeout --signal=TERM --kill-after=30s 45m ./build.sh release --init 2>&1 \
            | tee "$PAIRED_ROOT/evidence/dependency-initialize.log"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf '%s\n' \
            '798aa952d536563ee0291e69251a6d0cd0d85e0c470d5499768fa0731ff3c1be  deps/3rd/u01/obclient/bin/obclient' \
            '64e0323b385af2831c5b166a375e8320ec40e3ead0bd925295de1b8f5a2196c6  deps/3rd/u01/obclient/bin/mysqltest' \
            | sha256sum -c -

      - name: Run all original native cases then strict separate proof and eight fresh same-host rounds
        shell: bash
        run: |
          set -euo pipefail
          test "$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n1 | tr -d ' ')" -ge 8589934592
          timeout --signal=TERM --kill-after=180s 180m python3 -B "$PAIRED_ROOT/driver/fts_paired_validation.py" \
            --phase validate --source "$GITHUB_WORKSPACE" --root "$PAIRED_ROOT" \
            --driver-sha "$GITHUB_SHA" --execute

      - name: Always print explicit final or partial continuation verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$PAIRED_ROOT/driver/fts_paired_validation.py"; then
            python3 -B "$PAIRED_ROOT/driver/fts_paired_validation.py" --phase finalize \
              --source "$GITHUB_WORKSPACE" --root "$PAIRED_ROOT" --driver-sha "$GITHUB_SHA" --execute
          else
            echo 'PAIRED_NOT_STARTED: prerequisites or verification failed; no calibration claimed'
            exit 1
          fi

      - name: Collect bounded new evidence only and preserve the historical collector failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/script/seekdb/fts_paired_validation.py --phase collect-evidence \
            --source "$GITHUB_WORKSPACE" --root "$PAIRED_ROOT" --driver-sha "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/seekdb-paired-artifact"

      - name: Preserve new continuation proof without re-uploading unchanged giant ELFs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fts-continuation-${{ github.sha }}
          path: ${{ runner.temp }}/seekdb-paired-artifact/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
          include-hidden-files: false

      - name: Always publish readable result and raw native failure in summary and bounded logs
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free -b
          python3 -B .github/script/seekdb/fts_paired_validation.py --phase present \
            --source "$GITHUB_WORKSPACE" --root "$PAIRED_ROOT" --driver-sha "$GITHUB_SHA" \
            --summary "$GITHUB_STEP_SUMMARY"
          if test -f "$PAIRED_ROOT/report.json"; then
            python3 -B - "$PAIRED_ROOT/report.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1], encoding="utf-8"))
          print("PAIRED_VISIBLE_RESULT", json.dumps({k:r[k] for k in
              ("status","driverCommit","validationDriverCommit","candidateBuildCommit","mode",
               "kernelOrigin","baselineCommit","builds","caseVerdicts","supplementalCompatibility",
               "artifactReuse","roundVerdicts","sameHostPerformance","failure","formalContestRun",
               "allOfficialInputsUnchanged","planAssertions") if k in r}, ensure_ascii=False))
          PY
          fi
