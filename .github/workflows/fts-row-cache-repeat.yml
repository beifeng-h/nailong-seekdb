name: SeekDB preserved ELF row-cache repeat

on:
  push:
    branches: [perf/fts-profile-diagnostics-20261111]
    paths:
      - .github/script/seekdb/fts_row_cache_repeat.py
      - .github/script/seekdb/test_fts_row_cache_repeat.py
      - .github/workflows/fts-row-cache-repeat.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: seekdb-fts-free-linux-validation
  cancel-in-progress: false

jobs:
  repeat:
    if: ${{ github.repository == 'beifeng-h/nailong-seekdb' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      LC_ALL: C
      LANG: C
    steps:
      - name: Fetch the driver and both frozen source trees
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          root="$RUNNER_TEMP/seekdb-row-cache-repeat-$suffix"
          metadata="$RUNNER_TEMP/seekdb-row-cache-repeat-meta-$suffix"
          downloads="$RUNNER_TEMP/seekdb-row-cache-repeat-downloads-$suffix"
          for path in "$root" "$metadata" "$downloads"; do
            test ! -e "$path" && test ! -L "$path"
          done
          mkdir -m 0700 "$metadata" "$downloads"
          python3 -B - "$GITHUB_ENV" "$root" "$metadata" "$downloads" <<'PY'
          import datetime, pathlib, sys
          now = datetime.datetime.now(datetime.timezone.utc)
          values = dict(ROW_REPEAT_ROOT=sys.argv[2], ROW_REPEAT_META=sys.argv[3],
                        ROW_REPEAT_DOWNLOADS=sys.argv[4], ROW_REPEAT_OUT=sys.argv[2] + '-evidence',
                        ROW_REPEAT_STOP_UTC=(now + datetime.timedelta(minutes=45)).isoformat())
          with pathlib.Path(sys.argv[1]).open('a', encoding='utf-8') as output:
              for key, value in values.items():
                  output.write(key + '=' + value + '\n')
          PY
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config core.autocrlf false
          git -C "$GITHUB_WORKSPACE" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c maintenance.auto=false -c gc.auto=0 -C "$GITHUB_WORKSPACE" \
            fetch --atomic --no-auto-maintenance --no-tags --depth=1 origin \
            "$GITHUB_SHA" \
            2abe2633f85f41c1825fb144b29e2d3496e614df:refs/heads/fts-validation/frozen-base \
            603075716540b4f14dff9e8650bbcb0d4d60d338:refs/heads/fts-validation/frozen-candidate \
            5bce9e06d1281347ad61344e4b01fab9158c58a2:refs/heads/fts-validation/frozen-input-reference
          for sha in "$GITHUB_SHA" 2abe2633f85f41c1825fb144b29e2d3496e614df \
                     603075716540b4f14dff9e8650bbcb0d4d60d338 5bce9e06d1281347ad61344e4b01fab9158c58a2; do
            git -C "$GITHUB_WORKSPACE" cat-file -e "$sha^{commit}"
          done
          git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Check the independent scoring and schedule
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s .github/script/seekdb \
            -p test_fts_row_cache_repeat.py -v 2>&1 | tee "$ROW_REPEAT_META/offline-tests.log"

      - name: Verify the runtime tools and extract the pinned SQL client
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$ROW_REPEAT_META/prerequisites.log") 2>&1
          ready=true
          for tool in python3 readelf ldd; do
            if ! command -v "$tool" || ! "$tool" --version; then ready=false; fi
          done
          if ! test -r /lib/x86_64-linux-gnu/libaio.so.1t64; then ready=false; fi
          if test "$ready" != true; then
            sources="$ROW_REPEAT_META/apt-sources.list"
            parts="$ROW_REPEAT_META/apt-sourceparts"
            mkdir -m 0700 "$parts"
            cat > "$sources" <<'SOURCES'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe
          SOURCES
            opts=(-o "Dir::Etc::sourcelist=$sources" -o "Dir::Etc::sourceparts=$parts"
              -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
            sudo -n timeout --signal=TERM --kill-after=5s 120s apt-get "${opts[@]}" update --error-on=any
            sudo -n timeout --signal=TERM --kill-after=5s 120s env DEBIAN_FRONTEND=noninteractive \
              apt-get "${opts[@]}" install -y --no-install-recommends libaio1t64 binutils python3
          fi
          mkdir -m 0700 "$ROW_REPEAT_META/client-downloads"
          cd -- "$ROW_REPEAT_META/client-downloads"
          for name in obclient libobclient; do
            curl --fail --location --proto '=https' --proto-redir '=https' \
              --connect-timeout 15 --max-time 120 --output "$name-2.2.3-1.el8.x86_64.rpm" \
              "https://mirrors.oceanbase.com/oceanbase/community/stable/el/8/x86_64/$name-2.2.3-1.el8.x86_64.rpm"
          done
          printf '%s\n' \
            '35e38b580996fc583b0eaa961bd78911feff08981624154851db51d7e5aa935d  obclient-2.2.3-1.el8.x86_64.rpm' \
            'e53cadb0d91c1a0d78369f0c9488be8d774f03ea09346e7b218799a5318a9a68  libobclient-2.2.3-1.el8.x86_64.rpm' | sha256sum --check -
          python3 -B "$GITHUB_WORKSPACE/.github/script/seekdb/fts-profile-runtime/extract_official_obclient.py" \
            --output official-client

      - name: Download the pinned baseline executable
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: '14115653708'
          repository: beifeng-h/nailong-seekdb
          run-id: '43596282503'
          github-token: ${{ github.token }}
          path: ${{ env.ROW_REPEAT_DOWNLOADS }}/baseline
          skip-decompress: true
          digest-mismatch: error

      - name: Download the pinned candidate executable
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: '14144705933'
          repository: beifeng-h/nailong-seekdb
          run-id: '43667118747'
          github-token: ${{ github.token }}
          path: ${{ env.ROW_REPEAT_DOWNLOADS }}/candidate
          skip-decompress: true
          digest-mismatch: error

      - name: Run four original benchmark pairs without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t baseline < <(find "$ROW_REPEAT_DOWNLOADS/baseline" -mindepth 1 -maxdepth 1 -print0)
          mapfile -d '' -t candidate < <(find "$ROW_REPEAT_DOWNLOADS/candidate" -mindepth 1 -maxdepth 1 -print0)
          test "${#baseline[@]}" -eq 1 && test "${#candidate[@]}" -eq 1
          for archive in "${baseline[0]}" "${candidate[0]}"; do test -f "$archive" && test ! -L "$archive"; done
          remaining=$(python3 -B - "$ROW_REPEAT_STOP_UTC" <<'PY'
          import datetime, math, sys
          left = (datetime.datetime.fromisoformat(sys.argv[1]) - datetime.datetime.now(datetime.timezone.utc)).total_seconds()
          if left <= 180:
              raise SystemExit('No execution window remains before cleanup and collection')
          print(math.floor(left))
          PY
          )
          timeout --signal=TERM --kill-after=30s "${remaining}s" \
            python3 -B .github/script/seekdb/fts_row_cache_repeat.py --phase run \
            --source "$GITHUB_WORKSPACE" --root "$ROW_REPEAT_ROOT" --driver-sha "$GITHUB_SHA" \
            --baseline-zip "${baseline[0]}" --candidate-zip "${candidate[0]}" \
            --obclient "$ROW_REPEAT_META/client-downloads/official-client/bin/obclient" \
            --client-receipt "$ROW_REPEAT_META/client-downloads/official-client/receipt.json" \
            --stop-deadline-utc "$ROW_REPEAT_STOP_UTC" 2>&1 | tee "$ROW_REPEAT_META/driver.log"

      - name: Collect evidence and cleanup receipts
        if: ${{ always() }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          if test -d "${ROW_REPEAT_ROOT:-}/evidence"; then
            timeout --signal=TERM --kill-after=10s 120s \
              python3 -B .github/script/seekdb/fts_row_cache_repeat.py --phase collect \
              --source "$GITHUB_WORKSPACE" --root "$ROW_REPEAT_ROOT" --out "$ROW_REPEAT_OUT"
          fi

      - name: Preserve repeat evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seekdb-row-cache-repeat-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ROW_REPEAT_OUT }}/
            ${{ env.ROW_REPEAT_META }}/*.log
            ${{ env.ROW_REPEAT_META }}/client-downloads/official-client/receipt.json
          if-no-files-found: error
          retention-days: 3

      - name: Show the measured result
        if: ${{ always() }}
        shell: bash
        run: |
          python3 -B - "$ROW_REPEAT_ROOT/report.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          if path.is_file():
              report = json.loads(path.read_text())
              visible = {key: report[key] for key in ('status', 'passed', 'newBuilds',
                          'originalNineMetricResult', 'formalContestRun', 'comparisons', 'failure') if key in report}
              print(json.dumps(visible))
              with pathlib.Path(sys.argv[2]).open('a', encoding='utf-8') as output:
                  output.write('Preserved executable repeat\n\n```json\n' + json.dumps(visible, indent=2) + '\n```\n')
          PY
