name: SeekDB FTS inverted-only build sort validation

on:
  push:
    branches: [perf/fts-profile-diagnostics-20261111]
    paths:
      - src/rootserver/ddl_task/ob_ddl_common_rs_impl.cpp
      - .github/script/seekdb/fts_encoded_sort_validation.py
      - .github/script/seekdb/fts_inverted_sort_validation.py
      - .github/script/seekdb/test_fts_inverted_sort_validation.py
      - .github/script/seekdb/test_fts_encoded_sort_validation.py
      - .github/workflows/fts-encoded-sort-validation.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: seekdb-fts-free-linux-validation
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.repository == 'beifeng-h/nailong-seekdb' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SORT_BASELINE_DIAGNOSTICS_ONLY: '0'
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      GIT_TERMINAL_PROMPT: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      LC_ALL: C
      LANG: C
    steps:
      - name: Fetch exact candidate baseline and original input objects
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          root="$RUNNER_TEMP/seekdb-count-only-$suffix"
          metadata="$RUNNER_TEMP/seekdb-count-only-metadata-$suffix"
          downloads="$RUNNER_TEMP/seekdb-count-only-baseline-$suffix"
          for path in "$root" "$metadata" "$downloads"; do
            test ! -e "$path" && test ! -L "$path"
          done
          mkdir -m 0700 "$metadata" "$downloads"
          {
            printf 'ENCODED_SORT_ROOT=%s\n' "$root"
            printf 'ENCODED_SORT_META_ROOT=%s\n' "$metadata"
            printf 'ENCODED_SORT_BASELINE_DOWNLOAD=%s\n' "$downloads"
            printf 'ENCODED_SORT_CANDIDATE_OUT=%s/seekdb-count-only-candidate-%s\n' "$RUNNER_TEMP" "$suffix"
            printf 'ENCODED_SORT_EVIDENCE_OUT=%s/seekdb-count-only-evidence-%s\n' "$RUNNER_TEMP" "$suffix"
          } >> "$GITHUB_ENV"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c maintenance.auto=false -c gc.auto=0 -C "$GITHUB_WORKSPACE" \
            fetch --atomic --no-auto-maintenance --no-tags --depth=1 origin \
            "$GITHUB_SHA" c3d798873b700987b6983043d2abf0defd8e2500 \
            5bce9e06d1281347ad61344e4b01fab9158c58a2
          for sha in "$GITHUB_SHA" c3d798873b700987b6983043d2abf0defd8e2500 \
            5bce9e06d1281347ad61344e4b01fab9158c58a2; do
            git -C "$GITHUB_WORKSPACE" cat-file -e "$sha^{commit}"
          done
          git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Check driver regressions and the FTS sort candidate proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s .github/script/seekdb \
            -p test_fts_encoded_sort_validation.py -v \
            2>&1 | tee "$ENCODED_SORT_META_ROOT/offline-tests.log"
          python3 -B -m unittest discover -s .github/script/seekdb \
            -p test_fts_inverted_sort_validation.py -v \
            2>&1 | tee -a "$ENCODED_SORT_META_ROOT/offline-tests.log"
          python3 -B -m unittest discover -s .github/script/seekdb \
            -p test_fts_cs45_equality_validation.py -v \
            2>&1 | tee -a "$ENCODED_SORT_META_ROOT/offline-tests.log"
          python3 -B -m unittest discover -s .github/script/seekdb/fts-profile-runtime \
            -p 'test_*.py' -v \
            2>&1 | tee -a "$ENCODED_SORT_META_ROOT/offline-tests.log"
          python3 -B .github/script/seekdb/fts_inverted_sort_validation.py --phase proof \
            --source "$GITHUB_WORKSPACE" --root "$ENCODED_SORT_ROOT" --driver-sha "$GITHUB_SHA" \
            > "$ENCODED_SORT_META_ROOT/source-proof.json"

      - name: Admit resources after reclaiming the original disposable image tools
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$ENCODED_SORT_META_ROOT/host-resources.log") 2>&1
          for image_tool in /usr/local/lib/android /usr/share/dotnet /opt/ghc; do
            if test -e "$image_tool"; then
              resolved=$(realpath -- "$image_tool")
              test "$resolved" = "$image_tool"
              case "$resolved" in
                /usr/local/lib/android|/usr/share/dotnet|/opt/ghc) sudo -n rm -rf -- "$resolved" ;;
                *) exit 2 ;;
              esac
            fi
          done
          uname -srmo
          getconf GNU_LIBC_VERSION
          nproc
          free -b
          df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          test "$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n1 | tr -d ' ')" -ge 48318382080

      - name: Reuse installed host prerequisites and install actual missing packages
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$ENCODED_SORT_META_ROOT/prerequisites.log") 2>&1
          tools=(git wget curl rpm rpm2cpio cpio make gcc g++ readelf m4 file python3 libtool ldd /usr/bin/time timeout)
          packages=(git wget curl rpm rpm2cpio cpio make build-essential build-essential binutils m4 file python3 libtool-bin libc-bin time coreutils)
          missing=()
          for index in "${!tools[@]}"; do
            tool=${tools[$index]}
            if command -v "$tool"; then
              printf 'Available prerequisite: %s\n' "$tool"
            else
              printf 'Missing prerequisite: %s\n' "$tool"
              missing+=("${packages[$index]}")
            fi
          done
          if test -r /lib/x86_64-linux-gnu/libaio.so.1t64; then
            ls -l -- /lib/x86_64-linux-gnu/libaio.so.1t64
          else
            missing+=(libaio1t64)
          fi
          if test "${#missing[@]}" -eq 0; then
            printf 'Installed host prerequisites passed.\n'
          else
            mapfile -t missing < <(printf '%s\n' "${missing[@]}" | sort -u)
            for host in archive.ubuntu.com security.ubuntu.com; do
              timeout --signal=TERM --kill-after=2s 10s getent ahostsv4 "$host"
            done
            apt_sources="$ENCODED_SORT_META_ROOT/apt-sources.list"
            apt_sourceparts="$RUNNER_TEMP/seekdb-count-only-apt-sourceparts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            mkdir -m 0700 "$apt_sourceparts"
            test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
            cat > "$apt_sources" <<'SOURCES'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-backports main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe
          SOURCES
            apt_options=(-o "Dir::Etc::sourcelist=$apt_sources" -o "Dir::Etc::sourceparts=$apt_sourceparts"
              -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
            sudo -n timeout --signal=TERM --kill-after=15s 180s \
              apt-get "${apt_options[@]}" update --error-on=any
            sudo -n env DEBIAN_FRONTEND=noninteractive \
              timeout --signal=TERM --kill-after=15s 300s \
              apt-get "${apt_options[@]}" install -y --no-install-recommends "${missing[@]}"
          fi
          for tool in "${tools[@]}"; do command -v "$tool"; done
          test -r /lib/x86_64-linux-gnu/libaio.so.1t64
          python3 --version
          readelf --version
          gcc --version
          g++ --version

      - name: Download the exact complete c3d7988 baseline ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 10
        with:
          artifact-ids: '14006965532'
          repository: beifeng-h/nailong-seekdb
          run-id: '43350361661'
          github-token: ${{ github.token }}
          path: ${{ env.ENCODED_SORT_BASELINE_DOWNLOAD }}
          skip-decompress: true
          digest-mismatch: error

      - name: Verify and prepare the precise c3d7988 baseline
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t archives < <(find "$ENCODED_SORT_BASELINE_DOWNLOAD" -mindepth 1 -maxdepth 1 -print0)
          test "${#archives[@]}" -eq 1
          test -f "${archives[0]}" && test ! -L "${archives[0]}"
          test "$(stat -c '%h' -- "${archives[0]}")" -eq 1
          python3 -B .github/script/seekdb/fts_inverted_sort_validation.py --phase prepare \
            --source "$GITHUB_WORKSPACE" --root "$ENCODED_SORT_ROOT" --driver-sha "$GITHUB_SHA" \
            --artifact-zip "${archives[0]}"

      - name: Preserve original dependency downloads through HTTPS mirror transport
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/seekdb-count-only-https-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 0700 "$tools"
          cat > "$tools/wget" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          args=()
          for value in "$@"; do
            case "$value" in
              http://mirrors.oceanbase.com/*) value="https://mirrors.oceanbase.com/${value#http://mirrors.oceanbase.com/}" ;;
              https://mirrors.oceanbase.com/*) ;;
              http://*|https://*) echo 'Unexpected dependency download host' >&2; exit 93 ;;
            esac
            args+=("$value")
          done
          exec /usr/bin/wget --https-only --timeout=30 --tries=1 "${args[@]}"
          SH
          chmod 0755 "$tools/wget"
          printf '%s\n' "$tools" >> "$GITHUB_PATH"

      - name: Set up the unchanged pinned Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: 'false'
          crates-mirror: 'false'

      - name: Initialize the original release build and check prebuild evidence
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 15m ./build.sh release --init \
            2>&1 | tee "$RUNNER_TEMP/seekdb-count-only-initialize-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          python3 -B .github/script/seekdb/fts_inverted_sort_validation.py --phase prebuild \
            --source "$GITHUB_WORKSPACE" --root "$ENCODED_SORT_ROOT" --driver-sha "$GITHUB_SHA"

      - name: Build the complete candidate once with the original two-job profile
        if: ${{ env.SORT_BASELINE_DIAGNOSTICS_ONLY != '1' }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e build_release/src/observer/seekdb
          cmake_bin="$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/bin/cmake"
          /usr/bin/time -v timeout --signal=TERM --kill-after=30s 65m "$cmake_bin" \
            --build build_release --target seekdb -j2 \
            2>&1 | tee "$RUNNER_TEMP/seekdb-count-only-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          python3 -B .github/script/seekdb/fts_inverted_sort_validation.py --phase snapshot \
            --source "$GITHUB_WORKSPACE" --root "$ENCODED_SORT_ROOT" --driver-sha "$GITHUB_SHA"
          python3 -B .github/script/seekdb/fts_inverted_sort_validation.py --phase preserve \
            --source "$GITHUB_WORKSPACE" --root "$ENCODED_SORT_ROOT" --driver-sha "$GITHUB_SHA" \
            --out "$ENCODED_SORT_CANDIDATE_OUT"

      - name: Preserve the full candidate before SQL validation
        if: ${{ env.SORT_BASELINE_DIAGNOSTICS_ONLY != '1' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fts-encoded-sort-candidate-${{ github.sha }}
          path: ${{ env.ENCODED_SORT_CANDIDATE_OUT }}/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false

      - name: Validate native SQL and original nine-metric ABBA
        if: ${{ env.SORT_BASELINE_DIAGNOSTICS_ONLY != '1' }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=120s 20m \
            python3 -B .github/script/seekdb/fts_inverted_sort_validation.py --phase validate \
            --source "$GITHUB_WORKSPACE" --root "$ENCODED_SORT_ROOT" --driver-sha "$GITHUB_SHA"

      - name: Collect bounded evidence and build log tails
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if test -d "$ENCODED_SORT_META_ROOT"; then
            for name in initialize build; do
              log="$RUNNER_TEMP/seekdb-count-only-$name-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
              if test -f "$log"; then
                tail -c 524288 "$log" > "$ENCODED_SORT_META_ROOT/$name-tail.log"
              fi
            done
          fi
          if test -d "$ENCODED_SORT_ROOT/evidence/candidate"; then
            python3 -B .github/script/seekdb/fts_inverted_sort_validation.py --phase collect \
              --source "$GITHUB_WORKSPACE" --root "$ENCODED_SORT_ROOT" --driver-sha "$GITHUB_SHA" \
              --out "$ENCODED_SORT_EVIDENCE_OUT"
          fi

      - name: Upload validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fts-encoded-sort-evidence-${{ github.sha }}
          path: |
            ${{ env.ENCODED_SORT_EVIDENCE_OUT }}/
            ${{ env.ENCODED_SORT_META_ROOT }}/
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn
          include-hidden-files: false

      - name: Publish the current validation result
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - "$ENCODED_SORT_ROOT/report.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          report = json.loads(path.read_text(encoding='utf-8')) if path.is_file() else {'status': 'not_prepared'}
          visible = {key: report[key] for key in (
              'status', 'failurePhase', 'error', 'correctnessPassed', 'sameHostPerformance',
              'originalBenchmarkScorerRun', 'formalContestRun', 'baselineRebuilt', 'limitations',
              'validationScope', 'baselineCountPreflightPassed', 'countOnlySqlParityPassed',
              'countOnlyPlanProofPassed',
              'diagnosticOnly', 'candidateBuildAttempted', 'baselineDiagnostics',
              'legacyScoredControlErrors', 'newDenseCountExpectedResultsPassed', 'matrixRawSqlCounts',
              'allMatrixSqlSucceeded', 'inheritedBaselineCountErrors',
          ) if key in report}
          print('ENCODED_SORT_VISIBLE_RESULT', json.dumps(visible))
          with open(sys.argv[2], 'a', encoding='utf-8') as summary:
              summary.write('FTS encoded build sort validation\n\n')
              summary.write('```json\n' + json.dumps(visible, indent=2) + '\n```\n')
          PY
