name: MiniVectorDB development entry validation

on:
  push:
    branches:
      - codex/minivectordb-development-entry-m9

permissions:
  contents: read

concurrency:
  group: minivectordb-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build the default development image
        shell: bash
        run: |
          set -euo pipefail
          image="minivectordb-entry:${GITHUB_SHA}"
          git archive --format=tar HEAD \
            .dockerignore Dockerfile CMakeLists.txt include src tests mysqltest \
            | docker build --no-cache --platform linux/amd64 \
              --progress plain --tag "$image" -
          docker image inspect "$image" --format \
            'DEFAULT_CONFIG Entrypoint={{json .Config.Entrypoint}} Cmd={{json .Config.Cmd}} WorkingDir={{json .Config.WorkingDir}} Labels={{json .Config.Labels}}'

      - name: Check default entry through real container pipes
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/development_protocol_test.py \
            --container-image "minivectordb-entry:${GITHUB_SHA}" \
            --report "$RUNNER_TEMP/development-pipes.json"
