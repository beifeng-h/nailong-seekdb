name: MiniVectorDB positional read validation

on:
  push:
    branches:
      - codex/minivectordb-positional-read-m7

permissions:
  contents: read

concurrency:
  group: minivectordb-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build and check the pinned development image
        shell: bash
        run: |
          set -euo pipefail
          image="minivectordb-ci:${GITHUB_SHA}"
          git archive --format=tar HEAD \
            .dockerignore Dockerfile CMakeLists.txt include src tests mysqltest \
            | docker build --no-cache --platform linux/amd64 \
              --target development-checks --progress plain --tag "$image" -
          docker image inspect "$image" --format '{{.Id}}'

      - name: Check process-kill recovery without network access
        shell: bash
        run: |
          set -euo pipefail
          image="minivectordb-ci:${GITHUB_SHA}"
          docker run --rm --network none --cpus 2 --memory 2g \
            --entrypoint /bin/sh "$image" -ec '
              mkdir -p /data
              python3 /source/tests/crash_recovery.py /build/storage_fault_driver \
                --scope "development container page layer" \
                --report /data/page-crash.json
              python3 /source/tests/crash_recovery.py /build/database_fault_driver \
                --sort-cleanup --scope "development container Database layer" \
                --report /data/table-crash.json
              python3 /source/tests/crash_recovery.py /build/sql_fault_driver \
                --sort-cleanup --commit-returned-stage session.commit_returned \
                --scope "development container SqlSession using typed vector bindings" \
                --report /data/sql-crash.json
            '

      - name: Compare exact queries against the frozen read implementation
        shell: bash
        run: |
          set -euo pipefail
          image="minivectordb-ci:${GITHUB_SHA}"
          baseline="$RUNNER_TEMP/minivectordb-baseline.cpp"
          git show 0ad0aa5b3c843e5adf05e24362915b249607aed6:src/page_store.cpp > "$baseline"
          docker run --rm --network none --cpus 2 --memory 2g \
            --mount "type=bind,source=$baseline,target=/baseline.cpp,readonly" \
            --entrypoint /bin/sh "$image" -ec '
              mkdir -p /data
              g++ -std=gnu++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Werror \
                -I/source/include /baseline.cpp /source/tests/sql_public_case_driver.cpp \
                /build/libminivectordb.a -o /data/baseline-capture
              python3 /source/tests/query_read_comparison.py \
                --baseline /data/baseline-capture --candidate /build/sql_public_case_driver \
                --output /data/read-comparison --report /data/read-comparison.json
              cat /data/read-comparison.json
            '
