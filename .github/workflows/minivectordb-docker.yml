name: MiniVectorDB official stdio protocol validation

on:
  push:
    branches:
      - codex/minivectordb-official-protocol-m11-20261110

permissions:
  contents: read

concurrency:
  group: minivectordb-stdio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  protocol-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build the default database image from the source whitelist
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/minivectordb-context"
          mkdir -p "$context"
          git archive HEAD CMakeLists.txt Dockerfile .dockerignore include src third_party \
            tests mysqltest protocol_check STDIO_PROTOCOL.md | tar -x -C "$context"
          docker build --platform linux/amd64 --tag minivectordb-m11 "$context"
          docker image inspect minivectordb-m11 \
            --format '{{json .Config.Entrypoint}} {{json .Config.Cmd}} {{json .Config.Labels}}'

      - name: Check native protocol edge cases
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint python3 minivectordb-m11 \
            /source/tests/stdio_protocol_test.py --driver /build/minivectordb_server \
            --edges-only --report /tmp/m11-native-edges.json

      - name: Run the unchanged official handshake and public driver on the default image
        shell: bash
        run: |
          set -euo pipefail
          python3 protocol_check/run.py --image minivectordb-m11 --handshake-only \
            --output "$RUNNER_TEMP/m11-handshake"
          cat "$RUNNER_TEMP/m11-handshake/result.json"
          python3 protocol_check/run.py --image minivectordb-m11 \
            --output "$RUNNER_TEMP/m11-official-public"
          cat "$RUNNER_TEMP/m11-official-public/result.json"
