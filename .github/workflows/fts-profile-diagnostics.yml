name: SeekDB FTS profiling diagnostics

on:
  push:
    branches: [perf/fts-profile-diagnostics-20261111]
    paths-ignore:
      - .github/workflows/fts-profile-recording-analysis.yml
      - .github/script/seekdb/fts-profile-recording-analysis/**
      - .github/workflows/fts-profile-diagnostics.yml
      - .github/workflows/fts-cs45-equality-validation.yml
      - .github/script/seekdb/fts_cs45_equality_validation.py
      - .github/script/seekdb/test_fts_cs45_equality_validation.py
      - src/oblib/lib/charset/ob_charset.cpp
      - .github/workflows/fts-ik-charset-validation.yml
      - .github/script/seekdb/fts_ik_charset_validation.py
      - .github/script/seekdb/test_fts_ik_charset_validation.py
      - src/storage/fts/ik/ob_ik_char_util.h
      - src/storage/fts/ik/ob_ik_processor.h
      - src/storage/fts/ik/ob_ik_processor.cpp
      - src/storage/fts/ik/ob_ik_arbitrator.cpp

permissions:
  contents: read
  actions: read

concurrency:
  group: seekdb-fts-profile-diagnostics-20261111
  cancel-in-progress: false

jobs:
  profile:
    if: ${{ github.repository == 'beifeng-h/nailong-seekdb' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LC_ALL: C
      LANG: C
    steps:
      - name: Initialize this job's isolated output paths and UTC window
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/fts-profile-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$work" && test ! -L "$work"
          mkdir -m 0700 "$work"
          mkdir -m 0700 "$work/evidence" "$work/downloads"
          {
            printf 'PROFILE_WORK_ROOT=%s\n' "$work"
            printf 'PROFILE_JOB_STARTED_UTC=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - name: Checkout the exact diagnostic source directory
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/script/seekdb/fts-profile-runtime
          sparse-checkout-cone-mode: false

      - name: Install documented runtime and profiling prerequisites
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$PROFILE_WORK_ROOT/evidence/prerequisites.log") 2>&1
          prerequisites_ready=true
          for tool in python3 readelf ldd; do
            if command -v "$tool" && "$tool" --version; then
              printf 'Available tool: %s\n' "$tool"
            else
              printf 'Missing or unusable tool: %s\n' "$tool"
              prerequisites_ready=false
            fi
          done
          if test -x /usr/bin/python3; then
            /usr/bin/python3 --version
          else
            printf 'Missing driver interpreter: /usr/bin/python3\n'
            prerequisites_ready=false
          fi
          libaio=/lib/x86_64-linux-gnu/libaio.so.1t64
          if test -r "$libaio"; then
            ls -l -- "$libaio"
          else
            printf 'Missing required library: %s\n' "$libaio"
            prerequisites_ready=false
          fi
          perf_path=
          while IFS= read -r candidate; do
            test -x "$candidate" || continue
            printf 'Probing perf candidate: %s\n' "$candidate"
            if timeout 5s "$candidate" --version && \
              sudo -n timeout --signal=TERM --kill-after=5s 10s "$candidate" \
                stat -e cpu-clock:u -- sleep 0.05; then
              perf_path=$candidate
              break
            fi
          done < <(
            command -v perf || true
            if test -d /usr/lib/linux-tools; then
              find /usr/lib/linux-tools -maxdepth 3 -type f -name perf -print | sort -V -r
            fi
          )
          if test -n "$perf_path"; then
            printf 'Verified existing perf: %s\n' "$perf_path"
            printf '%s\n' "$(dirname -- "$perf_path")" >> "$GITHUB_PATH"
          fi
          if test "$prerequisites_ready" = true && test -n "$perf_path"; then
            printf 'Existing prerequisites passed; skipping APT.\n'
          else
            printf 'Existing prerequisites incomplete; checking official repository DNS before APT.\n'
            for host in archive.ubuntu.com security.ubuntu.com; do
              if ! timeout --signal=TERM --kill-after=2s 10s getent ahostsv4 "$host"; then
                printf 'Official repository DNS lookup failed or timed out: %s; APT was not started.\n' "$host"
                exit 2
              fi
            done
            apt_sources="$PROFILE_WORK_ROOT/evidence/apt-sources.list"
            apt_sourceparts="$PROFILE_WORK_ROOT/apt-sourceparts"
            mkdir -m 0700 "$apt_sourceparts"
            test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
            cat > "$apt_sources" <<'SOURCES'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-backports main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe
          SOURCES
            apt_options=(-o "Dir::Etc::sourcelist=$apt_sources" -o "Dir::Etc::sourceparts=$apt_sourceparts"
              -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
            sudo -n apt-get "${apt_options[@]}" update --error-on=any
            sudo -n env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" \
              install -y --no-install-recommends \
              libaio1t64 binutils python3 linux-tools-common linux-tools-generic
          fi

      - name: Download the exact original baseline ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        timeout-minutes: 10
        with:
          repository: beifeng-h/nailong-seekdb
          run-id: '42797329842'
          artifact-ids: '13757273442'
          github-token: ${{ github.token }}
          path: ${{ env.PROFILE_WORK_ROOT }}/downloads/baseline
          skip-decompress: true
          digest-mismatch: error

      - name: Download the exact candidate ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        timeout-minutes: 10
        with:
          repository: beifeng-h/nailong-seekdb
          run-id: '42953505169'
          artifact-ids: '13828533821'
          github-token: ${{ github.token }}
          path: ${{ env.PROFILE_WORK_ROOT }}/downloads/candidate
          skip-decompress: true
          digest-mismatch: error

      - name: Verify pinned inputs and capture the candidate profile
        timeout-minutes: 80
        shell: bash
        run: bash .github/script/seekdb/fts-profile-runtime/ci_profile.sh

      - name: Preserve diagnostic evidence and profiling outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fts-profile-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PROFILE_WORK_ROOT }}/evidence/
            ${{ env.PROFILE_WORK_ROOT }}/profiling/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 3
          include-hidden-files: false
